name: Kaartdata ophalen

on:
  workflow_dispatch:
  push:
    paths:
      - tools/fetch_data.py

permissions:
  contents: write
  pages: write

jobs:
  ophalen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Straten, gebouwen en luchtfoto's ophalen
        run: |
          mkdir -p data
          python3 -u tools/fetch_data.py 2>&1 | tee data/ophaal-log.txt
      - name: Opslaan in de repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Kaartdata bijgewerkt (OpenStreetMap, Digitaal Vlaanderen)"
          git pull --rebase origin main
          git push
      - name: Website opnieuw publiceren
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || true
