name: Kaartdata ophalen

on:
  workflow_dispatch:
  push:
    paths:
      - tools/fetch_data.py
      - .github/workflows/kaartdata.yml

permissions:
  contents: write

jobs:
  ophalen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Straten, gebouwen en luchtfoto's ophalen
        run: python3 tools/fetch_data.py
      - name: Opslaan in de repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Kaartdata bijgewerkt (OpenStreetMap, Digitaal Vlaanderen)"
          git pull --rebase origin main
          git push
